<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>True or False</title>

    <style>
        .answer {
            cursor: pointer;
        .answer:hover {
            background-color: #f0f0f0;
        }
        }
    </style>

    <script>
        function wrongAnswer() {
            document.getElementById("true").innerHTML = "Wrong answer!";
            document.getElementById("true").style.color = "red";
        }

        function rightAnswer() {
            document.getElementById("false").innerHTML = "Right answer!";
            document.getElementById("false").style.color = "green";
        }
        
    </script>
</head>

<body>
    <p>True or False: 2 + 2 = 5.</p>

    <div id="true" class="answer" onclick="wrongAnswer()">True</div>
    <div id="false" class="answer" onclick="rightAnswer()">False</div>
</body>
</html>
