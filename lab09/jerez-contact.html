    <h1>Contact</h1>

    <main>

        <div class="contact-row">
            <div class="contact-box">
                <p>
                    Adrian Jerez<br>
                    Syracuse University<br>
                    104 Smith Dr, University Hill<br>
                    Syracuse, NY 13244
                </p>
            </div>

            <div class="contact-box">
                <p>
                    <a href="mailto:aajerez@syr.edu">aajerez@syr.edu</a>
                </p>
                <p>
                    <a href="https://www.linkedin.com/in/adrian-jerez/" target="_blank">
                        <img src="../images/logo-sized.png" alt="LinkedIn Logo">
                    </a>
                </p>
            </div>
        </div>

        <div class="contact-row">
            <div class="contact-box">
                <h2>Contact Form</h2>

                <form action="https://formspree.io/f/xppwzzry" method="post">
                    <div class="field">
                        <label for="name">Your Name:</label>
                        <input type="text" id="name" name="name">
                    </div>

                    <div class="field">
                        <label for="reason">Reason for Contact:</label>
                        <select id="reason" name="reason">
                            <option value="school">School</option>
                            <option value="work">Work</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="message">Your Message:</label>
                        <textarea id="message" name="message" rows="5" cols="30"></textarea>
                    </div>

                    <input type="submit" value="Send">
                </form>
            </div>

            <div class="contact-box">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2916.13772072301!2d-76.13304149999998!3d43.038533750000006!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89d9f39fcf13d369%3A0x26e622667583a0a7!2sQuad%202%2C%20104%20Smith%20Dr%2C%20Syracuse%2C%20NY%2013210!5e0!3m2!1sen!2sus!4v1789104087770!5m2!1sen!2sus"
                    title="Map of Syracuse University"
                    width="600"
                    height="450"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>
        </div>
